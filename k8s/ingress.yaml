apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nproject-ingress
  namespace: default
spec:
  rules:
  - host: nproject.site
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nproject-app-svc
            port:
              number: 80
  - host: www.nproject.site
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nproject-app-svc
            port:
              number: 80