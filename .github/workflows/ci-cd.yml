name: Deploy Infrastructure and Application

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
  IMAGE_NAME:   nproject-app

jobs:
  terraform:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -reconfigure
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check -recursive

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -input=false
        env:
          TF_VAR_domain: "nproject.site"
          TF_VAR_yc_token: ${{ secrets.YC_TOKEN }}
          TF_VAR_yc_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_yc_folder_id: ${{ secrets.YC_FOLDER_ID }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}

      - name: Terraform Apply
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: ./terraform
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_domain: "nproject.site"
          TF_VAR_yc_token: ${{ secrets.YC_TOKEN }}
          TF_VAR_yc_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_yc_folder_id: ${{ secrets.YC_FOLDER_ID }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}

      - name: Read Terraform Outputs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: ./terraform
        run: |
          REGISTRY_ID=$(terraform output -raw registry_id 2>/dev/null || echo "")
          if [ -z "$REGISTRY_ID" ]; then
            echo "Error: YC_REGISTRY_ID is empty"
            exit 1
          fi
          echo "YC_REGISTRY_ID=$REGISTRY_ID" >> $GITHUB_ENV
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}

  deploy:
    name: Deploy Application to Kubernetes
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f app/requirements.txt ]; then
            pip install -r app/requirements.txt
          fi

      - name: Run tests
        working-directory: ./app
        run: |
          if [ -d tests ]; then
            python -m pytest tests/ -v
          else
            echo "No tests found, skipping."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: oauth
          password: ${{ secrets.YC_TOKEN }}

      - name: Build and push Docker image
        run: |
          if [ -z "${{ env.YC_REGISTRY_ID }}" ]; then
            echo "Error: YC_REGISTRY_ID is not set"
            exit 1
          fi
          IMAGE_TAG=cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker buildx build \
            --push \
            --platform=linux/amd64 \
            --tag "$IMAGE_TAG" \
            --file ./app/Dockerfile \
            ./app
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -n -a
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure YC CLI
        run: |
          yc config set token ${{ secrets.YC_TOKEN }}
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

      - name: Wait for Kubernetes cluster and get kubeconfig
        run: |
          echo "Waiting for cluster k8s-nproject-site-v2 to become ready..."
          for i in {1..30}; do
            if yc k8s cluster get k8s-nproject-site-v2 --format json > /dev/null 2>&1; then
              echo "Cluster is ready"
              yc k8s cluster get-credentials --name k8s-nproject-site-v2 --external
              exit 0
            fi
            echo "Cluster not ready, retrying in 20s... ($i/30)"
            sleep 20
          done
          echo "Timeout: cluster was not created within 10 minutes"
          exit 1

      - name: Update image tag in Kubernetes manifests
        run: |
          sed -i "s|__FOLDER_ID__|${{ secrets.YC_FOLDER_ID }}|g" k8s/deployment.yaml
          sed -i "s|__TAG__|${{ github.sha }}|g" k8s/deployment.yaml

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Get LoadBalancer IP
        id: get_ip
        run: |
          echo "Waiting for LoadBalancer IP..."
          for i in {1..10}; do
            IP=$(kubectl get svc nproject-app-svc -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
            if [ -n "$IP" ]; then
              echo "Found IP: $IP"
              echo "external_ip=$IP" >> $GITHUB_ENV
              exit 0
            fi
            echo "IP not ready, retrying in 30s... ($i/10)"
            sleep 30
          done
          echo "Timeout: LoadBalancer IP not found"
          exit 1

      - name: Enable automatic scanning for Container Registry
        run: yc container registry scan enable --id ${{ env.YC_REGISTRY_ID }}
        env:
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}

      - name: Terraform Init (for DNS)
        working-directory: ./terraform
        run: terraform init -reconfigure
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}

      - name: Terraform Apply DNS Records
        working-directory: ./terraform
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_domain: "nproject.site"
          TF_VAR_yc_token: ${{ secrets.YC_TOKEN }}
          TF_VAR_yc_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_yc_folder_id: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_external_ip: ${{ env.external_ip }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}