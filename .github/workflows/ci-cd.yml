name: Deploy Infrastructure and Application

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
  IMAGE_NAME: nproject-app

jobs:
  terraform:
    name: Terraform — Plan or Apply
    runs-on: ubuntu-latest
    outputs:
      registry_id: ${{ steps.get-outputs.outputs.registry_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -reconfigure
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check -recursive

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -input=false
        env:
          TF_VAR_domain: "nproject.site"
          TF_VAR_yc_token: ${{ secrets.YC_TOKEN }}
          TF_VAR_yc_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_yc_folder_id: ${{ secrets.YC_FOLDER_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}

      - name: Terraform Apply (only on push / dispatch)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: ./terraform
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_domain: "nproject.site"
          TF_VAR_yc_token: ${{ secrets.YC_TOKEN }}
          TF_VAR_yc_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_yc_folder_id: ${{ secrets.YC_FOLDER_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}

      - name: Read Terraform Outputs
        id: get-outputs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: ./terraform
        run: |
          REGISTRY_ID=$(terraform output -raw registry_id 2>/dev/null)
          if [ -z "$REGISTRY_ID" ]; then
            echo "Error: registry_id is empty or not defined"
            exit 1
          fi
          echo "registry_id=$REGISTRY_ID" >> "$GITHUB_OUTPUT"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}

  deploy:
    name: Deploy Application to Kubernetes
    needs: terraform
    runs-on: ubuntu-latest
    # ЗАПУСКАТЬ ТОЛЬКО ПРИ ПУШЕ В main ИЛИ ВРУЧНУЮ
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    env:
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      IMAGE_NAME: nproject-app
      YC_REGISTRY_ID: ${{ needs.terraform.outputs.registry_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f app/requirements.txt ]; then
            pip install -r app/requirements.txt
          fi

      - name: Run tests
        run: |
          if [ -d app/tests ]; then
            python -m pytest app/tests/ -v
          else
            echo "No tests found, skipping."
          fi
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -n
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure YC CLI
        run: |
          yc config set token ${{ secrets.YC_TOKEN }}
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

      - name: Login to Yandex Container Registry
        run: yc container registry configure-docker

      - name: Build and push Docker image
        run: |
          if [ -z "${{ env.YC_REGISTRY_ID }}" ]; then
            echo "Error: YC_REGISTRY_ID is not set"
            exit 1
          fi
          IMAGE_TAG="cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker buildx build \
            --push \
            --platform=linux/amd64 \
            --tag "$IMAGE_TAG" \
            --file ./app/Dockerfile \
            ./app
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Wait for Kubernetes cluster and get kubeconfig
        run: |
          for i in {1..30}; do
            if yc k8s cluster get k8s-nproject-site-v2 --format json > /dev/null 2>&1; then
              yc k8s cluster get-credentials --name k8s-nproject-site-v2 --external
              exit 0
            fi
            echo "Cluster not ready, retrying in 20s... ($i/30)"
            sleep 20
          done
          echo "Timeout: cluster was not created"
          exit 1

      - name: Update image tag in Kubernetes manifests
        run: |
          sed -i "s|__REGISTRY_ID__|${{ needs.terraform.outputs.registry_id }}|g" k8s/deployment.yaml
          sed -i "s|__TAG__|${{ github.sha }}|g" k8s/deployment.yaml

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Get LoadBalancer IP
        run: |
          for i in {1..10}; do
            IP=$(kubectl get svc nproject-app-svc -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
            if [ -n "$IP" ]; then
              echo "external_ip=$IP" >> $GITHUB_ENV
              exit 0
            fi
            sleep 30
          done
          echo "Timeout: LoadBalancer IP not found"
          exit 1

      - name: Terraform Init (for DNS update)
        working-directory: ./terraform
        run: terraform init -reconfigure
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}

      - name: Terraform Apply DNS Records
        working-directory: ./terraform
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_domain: "nproject.site"
          TF_VAR_yc_token: ${{ secrets.YC_TOKEN }}
          TF_VAR_yc_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_yc_folder_id: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_external_ip: ${{ env.external_ip }}
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}