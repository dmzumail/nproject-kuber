[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nproject-app"
version = "1.0.0"
description = "Спортивный секундомер на FastAPI"
authors = [
    {name = "Dmitry", email = "dmitry@nproject.site"},
]
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.29.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.1.1",
    "httpx==0.27.0",
    "pytest-asyncio==0.23.7",
]

[tool.setuptools.packages.find]
where = ["."]      # Ищет пакеты в корне проекта
include = ["app*"] # Включает app/ как пакет